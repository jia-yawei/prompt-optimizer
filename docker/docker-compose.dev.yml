services:
  prompt-optimizer:
    # 开发模式：从源码构建
    build:
       context: ..
       dockerfile: Dockerfile
    image: linshen/prompt-optimizer:dev
    container_name: prompt-optimizer-dev
    restart: unless-stopped
    ports:
      - "28082:${NGINX_PORT:-80}"
    extra_hosts:
      - "host.docker.internal:host-gateway"  # 允许容器访问宿主机
    env_file:
      - ../.env.local     # 读取仓库根目录的本地环境变量文件
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -fsS http://localhost:${NGINX_PORT:-80}/healthz >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    environment:
      # nginx内部端口配置
      - NGINX_PORT=${NGINX_PORT:-80}

      # Web应用API配置（从 .env.local 读取，不在此处覆盖）

      # Basic认证配置（可选）
      - ACCESS_USERNAME=${ACCESS_USERNAME:-admin}
      - ACCESS_PASSWORD=${ACCESS_PASSWORD:-123456}
